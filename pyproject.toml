[project]
name = "booknlp"
version = "0.1.0"
description = "uv fork with updated dependencies"
readme = "README.md"
authors = [
    { name = "akupiec", email = "kupiecart@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm",
    "filelock>=3.12.0",
    "jinja2>=3.0.0",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0.1",
    "regex>=2023.8.8",
    "requests>=2.31.0",
    "setuptools>=84.0.0",
    "spacy>=3.5.0",
    "tokenizers>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.30.0",
]

[project.scripts]
booknlp = "booknlp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
