[project]
name = "booknlp"
version = "0.1.0"
description = "uv fork with updated dependencies"
readme = "README.md"
authors = [
    { name = "akupiec", email = "kupiecart@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "numpy>=1.24.0",
    "setuptools>=84.0.0",
    "spacy>=3.5.0",
    #progressbarr
    "tqdm>=4.65.0",
    #hugging face
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "transformers>=4.30.0",
]

[project.scripts]
booknlp = "booknlp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.10",
]
